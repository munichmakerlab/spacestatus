[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spacestatus"
version = "0.1.0"
description = "Flask app serving the Munich Maker Lab space status page and SpaceAPI endpoint"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Friedjof Noweck", email = "dev@noweck.info" },
]
keywords = ["spaceapi", "hackerspace", "flask", "munich-maker-lab"]
dependencies = [
    "blinker==1.8.2",
    "cachelib==0.9.0",
    "certifi==2024.8.30",
    "charset-normalizer==3.3.2",
    "click==8.1.7",
    "Flask==3.0.3",
    "Flask-Caching==2.3.0",
    "Flask-MQTT==1.2.1",
    "gunicorn==23.0.0",
    "idna==3.10",
    "itsdangerous==2.2.0",
    "Jinja2==3.1.4",
    "MarkupSafe==2.1.5",
    "packaging==24.1",
    "paho-mqtt==1.6.1",
    "requests==2.32.3",
    "urllib3==2.2.3",
    "Werkzeug==3.0.4",
]

[tool.hatch.build.targets.wheel]
include = ["app.py"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I"]
