name: Build test

# Verifies the Docker image still builds on every push to main, without publishing it.
# Actual publishing to GHCR happens in docker-build-push.yml on tag pushes.
on:
  push:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
